/* ================= 在线数据表：双向同步 ================= */
function syCfg(){ return state.meta.sync; }
function toB64(str){
  var bytes = new TextEncoder().encode(str), bin = "";
  for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function fromB64(b64){
  var bin = atob(String(b64 || "").replace(/\s/g, ""));
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function ghUrl(extra){
  var sy = syCfg();
  var p = String(sy.path || "data/workspace.json").replace(/^\/+/, "");
  var url = "https://api.github.com/repos/" + String(sy.repo || "").replace(/^\/+|\/+$/g, "") + "/contents/" +
            p.split("/").map(encodeURIComponent).join("/");
  if (extra === "none") return url;
  var q = extra || "";
  if (!q && sy.branch) q = "?ref=" + encodeURIComponent(sy.branch);
  return url + q;
}
function syncHeaders(){
  var sy = syCfg(), h = { "Content-Type": "application/json" };
  if (sy.provider === "github") {
    h["Accept"] = "application/vnd.github+json";
    h["X-GitHub-Api-Version"] = "2022-11-28";
    if (sy.key) h["Authorization"] = /^(Bearer|token)\s/i.test(sy.key) ? sy.key : "Bearer " + sy.key;
    return h;
  }
  if (sy.key) {
    if (sy.provider === "jsonbin") h["X-Master-Key"] = sy.key;
    else if (sy.provider === "supabase") { h["apikey"] = sy.key; h["Authorization"] = "Bearer " + sy.key; }
    else h["Authorization"] = /^Bearer\s/i.test(sy.key) ? sy.key : "Bearer " + sy.key;
  }
  return h;
}
function request(method, url, body, extraHeaders){
  var headers = syncHeaders();
  if (extraHeaders) Object.keys(extraHeaders).forEach(function(k){ headers[k] = extraHeaders[k]; });
  var ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
  var timer = window.setTimeout(function(){ if (ctrl) ctrl.abort(); }, 15000);
  return fetch(url, {
    method: method, headers: headers, cache: "no-store",
    body: body == null ? undefined : JSON.stringify(body),
    signal: ctrl ? ctrl.signal : undefined
  }).then(function(res){
    window.clearTimeout(timer);
    return res.text().then(function(text){
      var data = null;
      try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
      if (!res.ok) {
        var msg = "HTTP " + res.status;
        if (data && (data.message || data.error || data.msg)) msg += " · " + (data.message || data.error || data.msg);
        throw new Error(typeof msg === "string" ? msg : "HTTP " + res.status);
      }
      return data;
    });
  }, function(err){
    window.clearTimeout(timer);
    throw new Error(err && err.name === "AbortError" ? "请求超时（15 秒）" : "网络请求失败（可能是地址错误、断网或跨域限制）");
  });
}
function unwrapRemote(data){
  if (Array.isArray(data)) return data.length ? (data[0].data || data[0]) : null;
  if (data && data.record) return data.record;
  if (data && data.state) return data.state;
  if (data && data.data && !data.tasks) return data.data;
  return data;
}
function setSyncBusy(busy, text){
  var pill = document.getElementById("syncPill");
  if (!pill) return;
  if (busy) { pill.className = "status-pill syncing"; setText("syncPillText", text || "同步中…"); }
}
function syncDone(err){
  if (err) { syCfg().lastError = String(err.message || err); saveState(); }
  else { syCfg().lastError = ""; syCfg().lastSyncAt = nowISO(); saveState(); }
  render();
}
function saveSyncConfig(){
  var sy = syCfg();
  var p = document.getElementById("syProvider"), u = document.getElementById("syUrl"),
      k = document.getElementById("syKey"), a = document.getElementById("syAuto"),
      r = document.getElementById("syRepo"), pa = document.getElementById("syPath"), br = document.getElementById("syBranch");
  if (!p) return;
  sy.provider = p.value;
  if (u) sy.url = u.value.trim();
  if (r) sy.repo = r.value.trim().replace(/^https?:\/\/github\.com\//i, "").replace(/\/+$/, "");
  if (pa) sy.path = pa.value.trim() || "data/workspace.json";
  if (br) sy.branch = br.value.trim() || "main";
  sy.key = k ? k.value.trim() : "";
  sy.auto = !!(a && a.checked);
  saveState();
  render();
  scheduleCloudPush();
}
function fetchRemoteState(){
  var sy = syCfg();
  if (sy.provider === "github") {
    if (!sy.repo) return Promise.reject(new Error("请先填写仓库（owner/repo）并保存配置"));
    return request("GET", ghUrl(""), null).then(function(res){
      if (!res || typeof res !== "object" || !res.content) throw new Error("仓库里还没有这个文件，或路径不是文件");
      var text = res.encoding === "base64" ? fromB64(res.content) : res.content;
      try { return JSON.parse(text); } catch (e) { throw new Error("仓库文件内容不是 JSON（请确认是工作台导出的数据文件）"); }
    });
  }
  if (!sy.url) return Promise.reject(new Error("请先填写数据表地址并保存配置"));
  return request("GET", sy.url, null).then(function(data){
    var remote = unwrapRemote(data);
    if (!remote || typeof remote !== "object") throw new Error("数据表里还没有数据（可能是空的 Bin 或没有 id=main 这一行）");
    return remote;
  });
}
function cloudPush(silent){
  var sy = syCfg();
  if (sy.provider === "github") {
    if (!sy.repo) { if (!silent) toast("请先填写仓库（owner/repo）并保存配置。", "warn"); return Promise.reject(new Error("未配置")); }
    setSyncBusy(true, "上传中…");
    var sha = null;
    return request("GET", ghUrl(""), null).then(function(res){ sha = res && res.sha ? res.sha : null; },
        function(){ sha = null; })
      .then(function(){
        var payload = {
          message: "更新工作台数据 " + fmtDateTime(nowISO()),
          content: toB64(JSON.stringify(state, null, 2))
        };
        if (sha) payload.sha = sha;
        if (sy.branch) payload.branch = sy.branch;
        return request("PUT", ghUrl("none"), payload);
      })
      .then(function(){
        syncDone(null);
        if (!silent) toast("已上传到 GitHub 仓库文件。", "ok");
      }, function(err){
        syncDone(err);
        if (!silent) toast("上传失败：" + (err.message || err), "err", 8000);
        throw err;
      });
  }
  if (!sy.url) { if (!silent) toast("请先填写数据表地址并保存配置。", "warn"); return Promise.reject(new Error("未配置")); }
  setSyncBusy(true, "上传中…");
  var body, url = sy.url, extra = null, method = "PUT";
  if (sy.provider === "supabase") {
    url = sy.url.split("?")[0];
    method = "POST";
    body = [{ id: "main", data: state, updated_at: nowISO() }];
    extra = { "Prefer": "resolution=merge-duplicates,return=minimal" };
  } else {
    body = state;
  }
  return request(method, url, body, extra).then(function(){
    syncDone(null);
    if (!silent) toast("已上传到在线数据表。", "ok");
  }, function(err){
    syncDone(err);
    if (!silent) toast("上传失败：" + (err.message || err), "err", 7000);
    throw err;
  });
}
function cloudPull(opts){
  opts = opts || {};
  var sy = syCfg();
  setSyncBusy(true, opts.merge ? "合并中…" : "拉取中…");
  return fetchRemoteState().then(function(remote){
    var before = countAllRecords(state);
    if (opts.merge) {
      state = mergeStates(state, remote);
      touch({ sync: false });
      return cloudPush(true).then(function(){
        syncDone(null);
        var msg = "双向同步完成：本地 " + before + " 条，合并后 " + countAllRecords(state) + " 条。";
        if (!opts.silent) toast(msg, "ok", 6000); else toast("已从在线数据表合并最新数据。", "ok");
      });
    }
    var keepSync = state.meta.sync, keepAuto = state.meta.autoRollover;
    state = normalizeState(remote);
    state.meta.sync = keepSync;
    state.meta.autoRollover = keepAuto;
    syncDone(null);
    touch({ sync: false });
    if (!opts.silent) toast("已用数据表内容覆盖本地（" + countAllRecords(state) + " 条记录）。", "ok", 6000);
  }, function(err){
    syncDone(err);
    if (!opts.silent) toast("拉取失败：" + (err.message || err), "err", 7000);
    throw err;
  });
}
function syncTest(){
  var sy = syCfg();
  if (sy.provider === "github" ? !sy.repo : !sy.url) { toast("请先填写" + (sy.provider === "github" ? "仓库（owner/repo）" : "数据表地址") + "。", "warn"); return; }
  setSyncBusy(true, "测试中…");
  fetchRemoteState().then(function(remote){
    var n = remote && typeof remote === "object"
      ? ((remote.tasks || []).length + (remote.notes || []).length + (remote.projects || []).length + (remote.reviews || []).length)
      : 0;
    syncDone(null);
    toast(n ? "连接成功：数据表里已有 " + n + " 条记录。" : "连接成功，但数据表里还没有工作台数据（上传一次即可）。", "ok", 6000);
  }, function(err){
    syncDone(err);
    toast("连接失败：" + (err.message || err), "err", 8000);
  });
}
function scheduleCloudPush(){
  var sy = syCfg();
  if (!sy.auto) return;
  if (sy.provider === "github" ? !sy.repo : !sy.url) return;
  if (pushTimer) window.clearTimeout(pushTimer);
  pushTimer = window.setTimeout(function(){
    pushTimer = null;
    cloudPush(true).catch(function(){ toast("自动同步失败：" + (syCfg().lastError || "未知错误"), "err", 6000); });
  }, 4000);
}

function handleAction(action, el){

  if (action === "import-table") return tableImportFlow("");

  }

  }

function bindEvents(){

  window.addEventListener("beforeunload", function(){ saveState(); });
}
function saveWeekSummary(value, silent){
  var ta = document.getElementById("weekSummary");
  var text = value != null ? value : (ta ? ta.value : "");
  var ws = uiState.reviewWeek || weekStartISO(todayISO());
  var rec = activeOf(state.reviews).filter(function(r){ return r.weekStart === ws; })[0];
  if (!rec) {
    if (!text.trim()) return;
    rec = fixReview({ weekStart: ws, summary: text });
    state.reviews.push(rec);
  } else {
    rec.summary = text;
    rec.updatedAt = nowISO();
  }
  touch();
  if (!silent) toast("本周小结已保存（" + weekLabel(ws, addDays(ws, 6)) + "）。", "ok");
}
function copyWeekReport(){
  var ws = uiState.reviewWeek || weekStartISO(todayISO());
  var w = weekStats(state, ws);
  var rec = activeOf(state.reviews).filter(function(r){ return r.weekStart === ws; })[0];
  var lines = [];
  lines.push(weekLabel(ws, w.weekEnd));
  lines.push("");
  lines.push("一、本周完成 " + w.doneCount + " 件（新增待办 " + w.createdCount + " 条，新灵感 " + w.notes.length + " 条，顺延任务 " + w.postponed.length + " 条）");
  w.doneTasks.forEach(function(t){ lines.push("  ✓ " + t.title + "（" + PRI_MAP[t.priority].short + "）"); });
  lines.push("");
  lines.push("二、按优先级分布：高 " + w.byPriority.high + " / 中 " + w.byPriority.medium + " / 低 " + w.byPriority.low);
  lines.push("");
  lines.push("三、精力分布：");
  w.projectRows.forEach(function(r){ lines.push("  · " + r.name + "：完成 " + r.done + " / 进行中 " + r.open); });
  lines.push("");
  lines.push("四、卡点汇总：");
  var any = false;
  w.blocked.forEach(function(p){ any = true; lines.push("  ! 项目「" + p.name + "」卡在：" + p.blocker); });
  w.postponed.forEach(function(t){ any = true; lines.push("  ! 任务「" + t.title + "」已顺延 " + t.postpone + " 次"); });
  if (!any) lines.push("  （本周没有卡点）");
  lines.push("");
  lines.push("五、下周打算：");
  lines.push(rec && rec.summary ? rec.summary : "（还没写，去「每周复盘」补一段）");
  var text = lines.join("\n");
  var done = function(){ toast("周报文字已复制，可直接粘贴到群里或文档里。", "ok"); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function(){ fallbackCopy(text, done); });
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done){
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch (e) { toast("复制失败，请手动选择文字。", "warn"); }
  ta.remove();
}

/* ================= 启动 ================= */
function startDayTicker(){
  var last = todayISO();
  window.setInterval(function(){
    var now = todayISO();
    if (now !== last) {
      last = now;
      var moved = rolloverTasks(state, now);
      saveState();
      render();
      if (moved.length) toast("新的一天：已把 " + moved.length + " 条未完成的任务顺延到今天。", "warn", 9000);
    }
  }, 60000);
}
function init(){
  loadState();
  var today = todayISO();
  var moved = rolloverTasks(state, today);
  saveState();
  bindEvents();
  render();
  if (moved.length) {
    toast("已把 " + moved.length + " 条昨天没做完的任务顺延到今天，并记录顺延次数：" +
      moved.slice(0, 2).map(function(m){ return m.task.title; }).join("、") + (moved.length > 2 ? " 等" : ""), "warn", 9000);
  }
  if (storageMode === "memory") toast("当前环境不支持本地存储，数据只在本次会话中保留，请尽快导出备份。", "err", 10000);
  startDayTicker();
  checkExportReminder();
  var sy = syCfg();
  if (sy.auto && (sy.provider === "github" ? sy.repo : sy.url)) {
    cloudPull({ merge: true, silent: true }).catch(function(){});
  }
  window.setInterval(checkExportReminder, 30000);
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();
})();
</script>
